# single-node deployment: this process is both coordinator and worker, which
# is the right shape for a laptop demo and keeps the stack under the 16GB
# budget. a real deployment would split these onto separate nodes.
coordinator=true
node-scheduler.include-coordinator=true
http-server.http.port=8080
discovery.uri=http://localhost:8080
query.max-memory=1.5GB
query.max-memory-per-node=1.5GB
memory.heap-headroom-per-node=512MB

# dynamic catalog management: lets a client issue CREATE CATALOG / DROP
# CATALOG at query time instead of only reading catalog files at startup.
# this is what ops/wap.py relies on to register a Nessie-branch-scoped
# Iceberg REST catalog per WAP run (see .notes/decisions.md), since the
# REST catalog connector's branch targeting (iceberg.rest-catalog.uri
# path suffix, confirmed against the live stack) is a catalog-registration
# property, not a session property Trino exposes per query.
catalog.management=dynamic
