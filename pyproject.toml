[project]
name = "iceberg-lakehouse-platform"
version = "0.1.0"
description = "Local Iceberg lakehouse: Nessie catalog, Trino query engine, dbt transforms."
requires-python = ">=3.12"
dependencies = [
    "dbt-core==1.10.22",
    "dbt-trino==1.10.3",
    "dbt-duckdb==1.10.1",
    "duckdb==1.4.4",
    "numpy==2.5.1",
    "pyarrow==25.0.0",
    "pydantic==2.13.4",
    "structlog==26.1.0",
    "dlt[pyiceberg,filesystem]==1.29.1",
    "pyiceberg==0.11.1",
    "sqlalchemy==2.0.51",
    "dagster==1.13.16",
    "dagster-dbt==0.29.16",
    "dagster-webserver==1.13.16",
    # already present transitively via dbt-trino; pinned explicitly here because
    # ops/wap.py imports trino.dbapi directly to issue CREATE CATALOG / DROP CATALOG,
    # not just through the dbt adapter.
    "trino==0.338.0",
]

[dependency-groups]
dev = [
    "ruff==0.16.1",
    "mypy==1.19.1",
    "pytest==9.1.1",
]

[tool.uv]
# ingestion/ is run as a module (`uv run python -m ingestion.pipeline`), not installed
# as a distribution: no build backend is configured, so this stays a dependency
# environment rather than a built package.
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "N",   # pep8-naming
    "C4",  # flake8-comprehensions
    "PIE", # flake8-pie
    "RUF", # ruff-specific rules
]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
exclude = [
    "transform/lakehouse/target/",
    "transform/lakehouse/dbt_packages/",
    "\\.venv/",
]

[[tool.mypy.overrides]]
# pyarrow ships no py.typed marker and no stub package exists on PyPI as of
# this pin (25.0.0); every other dependency here does, so this is a
# targeted exception rather than a blanket relaxation.
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true
disable_error_code = ["import-untyped"]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = "-ra"
