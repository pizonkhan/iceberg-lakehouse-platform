# profiles.yml template for the "lakehouse" dbt project.
#
# No credentials live in this file, everything is read from environment
# variables at run time. Point dbt at it with:
#   dbt run --profiles-dir transform/lakehouse
# or export DBT_PROFILES_DIR=transform/lakehouse.
#
# duckdb target: fast local/CI dev target. Runs against a local DuckDB file
# and reads/writes Iceberg tables directly via the duckdb iceberg extension,
# talking to the same MinIO bucket the docker stack uses so results are
# comparable to the trino target without needing the full stack up.
#
# trino target: the real local stack (infra/docker-compose.yml). Catalog
# name "iceberg" matches infra/trino/etc/catalog/iceberg.properties.

lakehouse:
  target: "{{ env_var('DBT_TARGET', 'duckdb') }}"
  outputs:
    duckdb:
      type: duckdb
      path: "{{ env_var('DBT_DUCKDB_PATH', 'dev.duckdb') }}"
      threads: 4
      extensions:
        - httpfs
        - iceberg
      secrets:
        - type: s3
          region: "{{ env_var('MINIO_REGION', 'us-east-1') }}"
          key_id: "{{ env_var('MINIO_ROOT_USER', '') }}"
          secret: "{{ env_var('MINIO_ROOT_PASSWORD', '') }}"
          endpoint: "{{ env_var('MINIO_ENDPOINT', 'localhost:9000') }}"
          url_style: path
          use_ssl: false

    trino:
      type: trino
      method: none
      user: "{{ env_var('DBT_TRINO_USER', 'dbt') }}"
      host: "{{ env_var('DBT_TRINO_HOST', 'localhost') }}"
      port: "{{ env_var('DBT_TRINO_PORT', '8080') | int }}"
      database: iceberg
      schema: "{{ env_var('DBT_TRINO_SCHEMA', 'dev') }}"
      threads: 4
      # this single-node Trino caps query.max-memory-per-node at 1.5GB
      # (infra/trino/etc/config.properties), on a 2GB JVM heap. Building
      # silver_playback_sessions / silver_playback_sessions_rejected (a
      # CTAS scanning all ~120M rows of bronze_playback_sessions) reliably
      # exceeded that cap under Trino's defaults even with a
      # pushdown-friendly WHERE clause (see
      # macros/playback_malformed_predicate.sql): default scan and writer
      # concurrency each buffer enough in flight to blow the limit on
      # their own, and capping only one side still left the other over
      # budget. These four settings bound scan-side split concurrency
      # (initial_splits_per_node, task_concurrency) and writer-side
      # concurrency (scale_writers, task_min/max_writer_count) together,
      # confirmed by direct testing to bring the same query comfortably
      # under 1.5GB. See decisions.md for the full trace of what was
      # tried and ruled out. Cost is slower scans/writes at this table's
      # scale; every other model in this project is small enough not to
      # notice.
      session_properties:
        task_concurrency: 2
        initial_splits_per_node: 2
        scale_writers: false
        task_min_writer_count: 1
        task_max_writer_count: 1
