version: 2

models:
  - name: stg_subscriber_events
    description: >
      Thin, typed passthrough of the subscriber profile change-event
      stream. One row per change event, same grain as bronze: staging does
      not deduplicate, does not collapse history, and does not resolve
      status vocabulary. That work happens in silver_subscriber_events and
      gold's dim_subscriber build respectively.
    columns:
      - name: subscriber_id
        description: business key of the subscriber this change event belongs to.
        tests:
          - not_null
      - name: change_event_id
        description: unique identifier of this individual change event, the grain key of the stream.
        tests:
          - not_null
      - name: changed_at
        description: wall-clock instant the source system recorded this change (renamed from bronze's change_timestamp for _at suffix consistency).
        tests:
          - not_null
      - name: change_type
        description: "kind of change this row represents. observed values: signup, profile_update."
        tests:
          - not_null
      - name: email
        description: subscriber email address as of this change event.
      - name: display_name
        description: subscriber display name as of this change event.
      - name: country_code
        description: subscriber country as of this change event, ISO 3166-1 alpha-2.
      - name: acquisition_channel
        description: marketing channel the subscriber was acquired through, as of this change event.
      - name: signup_date
        description: the subscriber's original signup date, static across all of a subscriber's change events.
      - name: plan_tier
        description: subscription plan tier as of this change event.
      - name: status
        description: subscriber account status as of this change event, as recorded by the source system.
      - name: _source_file
        description: bronze ingestion metadata, passthrough unchanged.
      - name: _ingested_at
        description: bronze ingestion metadata, passthrough unchanged.
      - name: _batch_id
        description: bronze ingestion metadata, passthrough unchanged.
      - name: _payload_hash
        description: bronze ingestion metadata, passthrough unchanged.

  - name: stg_title_events
    description: >
      Thin, typed passthrough of the title metadata change-event stream.
      One row per change event, same grain as bronze: staging does not
      deduplicate and does not collapse history. That work happens in
      silver_title_events and gold's dim_title build respectively.
    columns:
      - name: title_id
        description: business key of the title this change event belongs to.
        tests:
          - not_null
      - name: change_event_id
        description: unique identifier of this individual change event, the grain key of the stream.
        tests:
          - not_null
      - name: changed_at
        description: wall-clock instant the source catalog recorded this change (renamed from bronze's change_timestamp for _at suffix consistency).
        tests:
          - not_null
      - name: change_type
        description: "kind of change this row represents. observed values: catalog_add, metadata_update."
        tests:
          - not_null
      - name: title_name
        description: title display name as of this change event.
      - name: content_type
        description: movie or series, as of this change event.
      - name: release_year
        description: calendar year the title was released, as of this change event.
      - name: runtime_minutes
        description: runtime in minutes for a movie, as of this change event. null for series.
      - name: maturity_rating
        description: content maturity rating as of this change event.
      - name: original_language
        description: original spoken language of the title, as of this change event.
      - name: is_original
        description: whether the title is a platform original, as of this change event.
      - name: _source_file
        description: bronze ingestion metadata, passthrough unchanged.
      - name: _ingested_at
        description: bronze ingestion metadata, passthrough unchanged.
      - name: _batch_id
        description: bronze ingestion metadata, passthrough unchanged.
      - name: _payload_hash
        description: bronze ingestion metadata, passthrough unchanged.

  - name: stg_plans
    description: Thin, typed passthrough of the static plan reference table. One row per plan.
    columns:
      - name: plan_id
        description: business key of the plan, unique.
        tests:
          - not_null
          - unique
      - name: plan_name
        description: display name of the plan.
        tests:
          - not_null
      - name: current_tier
        description: plan tier as currently priced. matches the plan_tier vocabulary used on subscriber events.
        tests:
          - not_null
      - name: current_price_usd
        description: current monthly-equivalent list price of the plan, in US dollars.
        tests:
          - not_null
      - name: billing_period
        description: "how the plan is billed. observed values: monthly, annual."
      - name: max_concurrent_streams
        description: number of simultaneous streams the plan allows.
      - name: video_quality
        description: "maximum video quality the plan supports. observed values: sd, hd, uhd."
      - name: has_ads
        description: whether the plan includes an ad-supported tier.
      - name: supports_downloads
        description: whether the plan allows offline downloads.
      - name: _source_file
        description: bronze ingestion metadata, passthrough unchanged.
      - name: _ingested_at
        description: bronze ingestion metadata, passthrough unchanged.
      - name: _batch_id
        description: bronze ingestion metadata, passthrough unchanged.
      - name: _payload_hash
        description: bronze ingestion metadata, passthrough unchanged.

  - name: stg_devices
    description: Thin, typed passthrough of the static device reference table. One row per device.
    columns:
      - name: device_id
        description: business key of the device, unique.
        tests:
          - not_null
          - unique
      - name: device_type
        description: "category of the device. observed values: tv, mobile, tablet, web, console."
        tests:
          - not_null
      - name: manufacturer
        description: device manufacturer.
      - name: model_name
        description: device model name.
      - name: os_name
        description: operating system running on the device.
      - name: is_mobile
        description: whether the device is a handheld form factor (mobile or tablet).
      - name: _source_file
        description: bronze ingestion metadata, passthrough unchanged.
      - name: _ingested_at
        description: bronze ingestion metadata, passthrough unchanged.
      - name: _batch_id
        description: bronze ingestion metadata, passthrough unchanged.
      - name: _payload_hash
        description: bronze ingestion metadata, passthrough unchanged.

  - name: stg_title_genres
    description: Thin, typed passthrough of the title-genre weighted association table. One row per (title, genre) pair.
    columns:
      - name: title_id
        description: business key of the title, half of the composite grain key.
        tests:
          - not_null
      - name: genre_name
        description: genre identifier, half of the composite grain key.
        tests:
          - not_null
      - name: allocation_weight
        description: fraction of the title attributed to this genre, sums to 1.0 across all genre rows for one title.
        tests:
          - not_null
      - name: _source_file
        description: bronze ingestion metadata, passthrough unchanged.
      - name: _ingested_at
        description: bronze ingestion metadata, passthrough unchanged.
      - name: _batch_id
        description: bronze ingestion metadata, passthrough unchanged.
      - name: _payload_hash
        description: bronze ingestion metadata, passthrough unchanged.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - title_id
              - genre_name

  - name: stg_playback_sessions
    description: >
      Thin, typed passthrough of the playback session stream (~120M rows).
      No filtering happens here: malformed rows (negative duration,
      ended-before-started, future timestamps) and the null-device_id
      rows are all still present. The quality gate lives downstream in
      int_playback_sessions_flagged / silver_playback_sessions. Heavy
      exact-uniqueness testing on playback_session_id is intentionally
      not run against this model; see decisions.md for why (single-node
      Trino, 1.5GB per-query memory cap, ~120M distinct string keys).
    columns:
      - name: playback_session_id
        description: business key of the playback session, unique per session.
        tests:
          - not_null
      - name: subscriber_id
        description: subscriber who watched.
        tests:
          - not_null
      - name: title_id
        description: title watched.
        tests:
          - not_null
      - name: device_id
        description: device the session streamed on. null when source-side device fingerprinting failed, left null deliberately rather than invented.
      - name: session_started_at
        description: wall-clock instant the playback session began.
        tests:
          - not_null
      - name: session_ended_at
        description: wall-clock instant the playback session ended. not guaranteed to be at or after session_started_at at this layer, see the malformed-row note above.
        tests:
          - not_null
      - name: watch_duration_seconds
        description: seconds of content watched during the session. not guaranteed non-negative at this layer, see the malformed-row note above.
        tests:
          - not_null
      - name: playback_percent
        description: fraction of the title watched during this session, 0 to 1, as reported by the client player.
      - name: buffering_count
        description: number of rebuffer events during the session, widened to bigint at staging (see model header comment).
      - name: avg_bitrate_kbps
        description: average streaming bitrate for the session in kilobits per second, widened to bigint at staging (see model header comment).
      - name: playback_quality
        description: streaming quality tier delivered for the session. null on rows ingested before the source system started emitting this field.
      - name: _source_file
        description: bronze ingestion metadata, passthrough unchanged.
      - name: _ingested_at
        description: bronze ingestion metadata, passthrough unchanged. used downstream as the reference instant for the future-timestamp quality check.
      - name: _batch_id
        description: bronze ingestion metadata, passthrough unchanged.
      - name: _payload_hash
        description: bronze ingestion metadata, passthrough unchanged.

  - name: stg_billing_ledger
    description: >
      Thin, typed passthrough of the billing ledger. Duplicate
      billing_transaction_id rows from upstream retries are still present
      here; dedup happens downstream in silver_billing_ledger.
    columns:
      - name: billing_transaction_id
        description: business key of the ledger entry. not unique at this layer, see model description.
        tests:
          - not_null
      - name: subscriber_id
        description: subscriber the charge, refund, credit, or proration applies to.
        tests:
          - not_null
      - name: plan_id
        description: plan associated with this transaction.
        tests:
          - not_null
      - name: payment_type
        description: "payment instrument used. observed values: card, paypal, gift_card, carrier_billing."
      - name: is_promo_applied
        description: whether a promotional discount applied to this transaction.
      - name: is_retry
        description: whether this transaction is a retry of a previously failed payment attempt.
      - name: is_autopay
        description: whether this transaction was collected via autopay rather than a manual payment.
      - name: transaction_type
        description: "kind of ledger entry. observed values: charge, refund, credit, proration."
        tests:
          - not_null
      - name: transaction_posted_at
        description: wall-clock instant the transaction posted to the subscriber's account.
        tests:
          - not_null
      - name: amount_usd
        description: transaction amount in US dollars, signed by transaction_type.
        tests:
          - not_null
      - name: tax_amount_usd
        description: tax portion of the transaction amount in US dollars, same sign convention as amount_usd.
      - name: _source_file
        description: bronze ingestion metadata, passthrough unchanged.
      - name: _ingested_at
        description: bronze ingestion metadata, passthrough unchanged. used downstream as the dedup tie-break field.
      - name: _batch_id
        description: bronze ingestion metadata, passthrough unchanged. used downstream as the dedup tie-break field.
      - name: _payload_hash
        description: bronze ingestion metadata, passthrough unchanged.

  - name: stg_watchlist_adds
    description: Thin, typed passthrough of the watchlist add event stream.
    columns:
      - name: watchlist_event_id
        description: business key of the watchlist add event, unique per event.
        tests:
          - not_null
          - unique
      - name: subscriber_id
        description: subscriber who added the title.
        tests:
          - not_null
      - name: title_id
        description: title that was added to the watchlist.
        tests:
          - not_null
      - name: added_at
        description: wall-clock instant the title was added to the watchlist.
        tests:
          - not_null
      - name: _source_file
        description: bronze ingestion metadata, passthrough unchanged.
      - name: _ingested_at
        description: bronze ingestion metadata, passthrough unchanged.
      - name: _batch_id
        description: bronze ingestion metadata, passthrough unchanged.
      - name: _payload_hash
        description: bronze ingestion metadata, passthrough unchanged.

  - name: stg_signup_funnel
    description: >
      Thin, typed passthrough of the signup funnel accumulating-snapshot
      source. Duplicate signup_id rows from upstream retries are still
      present here; dedup happens downstream in silver_signup_funnel.
    columns:
      - name: signup_id
        description: business key of the signup attempt. not unique at this layer, see model description.
        tests:
          - not_null
      - name: subscriber_id
        description: >
          subscriber the attempt belongs to. null until the attempt
          reaches the registered_at milestone: no subscriber entity
          exists yet for an attempt that has not registered.
      - name: attempt_started_at
        description: wall-clock instant the signup attempt began.
        tests:
          - not_null
      - name: registered_at
        description: wall-clock instant registration completed. null if the attempt has not reached this milestone.
      - name: email_verified_at
        description: wall-clock instant email verification completed. null if the attempt has not reached this milestone.
      - name: payment_method_added_at
        description: wall-clock instant a payment method was added. null if the attempt has not reached this milestone.
      - name: selected_plan_id
        description: plan chosen during the attempt (renamed from bronze's plan_id_selected for naming consistency). null if the attempt has not reached this milestone.
      - name: plan_selected_at
        description: wall-clock instant a plan was selected. null if the attempt has not reached this milestone.
      - name: first_stream_at
        description: wall-clock instant of the first completed stream, which completes the funnel. null if the attempt has not reached this milestone.
      - name: _source_file
        description: bronze ingestion metadata, passthrough unchanged.
      - name: _ingested_at
        description: bronze ingestion metadata, passthrough unchanged. used downstream as the dedup tie-break field.
      - name: _batch_id
        description: bronze ingestion metadata, passthrough unchanged. used downstream as the dedup tie-break field.
      - name: _payload_hash
        description: bronze ingestion metadata, passthrough unchanged.
