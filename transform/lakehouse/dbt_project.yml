name: "lakehouse"
version: "1.0.0"
config-version: 2

profile: "lakehouse"

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]

clean-targets:
  - "target"
  - "dbt_packages"

# folder-level materialization defaults, mirroring the medallion layers:
# staging is a thin view over source-conformed data, intermediate is the
# silver deliverable (deduplicated, quality-gated, typed), marts are the
# queryable dimensional model. Individual models can still override these.
#
# intermediate overrides the scaffold's original ephemeral default to
# table: these silver_* models are queried directly by gold (see
# .notes/modeling.md's point-in-time join examples, which reference
# silver_playback_sessions and silver_billing_ledger as real relations),
# and at playback's ~120M-row scale an ephemeral model would recompute
# its full CTE on every downstream reference instead of being read once.
# The one exception is int_playback_sessions_flagged, a shared-logic
# helper that stays ephemeral via its own model-level config.
models:
  lakehouse:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: table
      +schema: silver
    marts:
      +materialized: table
      dimensions:
        +schema: dimensions
      facts:
        +schema: facts
    # write-audit-publish demonstration scope (ops/wap.py, docs/evidence/write-audit-publish/).
    # Isolated in its own schema, no dimension/fact/silver model reads from it and it reads
    # from nothing else: purpose-built so the WAP mechanism has a small, fast target.
    wap_demo:
      +materialized: table
      +schema: wap_demo
